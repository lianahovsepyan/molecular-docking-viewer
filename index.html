<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Docking 3D Viewer - Liana Hovsepyan</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; text-align: center; }
        h1 { color: #333; }
        p { color: #666; }
        .viewer-container { width: 80%; height: 600px; margin: 20px auto; border: 2px solid #ccc; border-radius: 8px; overflow: hidden; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <h1>Molecular Docking 3D Viewer</h1>
    <p>Interactive 3D visualization of protein-ligand complex.</p>
    
    <div class="viewer-container">
        <!-- Mol* Viewer embedded directly -->
        <iframe src="https://molstar.org/viewer/?url=https://raw.githubusercontent.com/lianahovsepyan/molecular-docking-viewer/main/protein_clean.pdb"></iframe>
    </div>
</body>
</html>
